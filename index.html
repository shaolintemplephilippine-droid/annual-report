// ===================== Utils =====================
function fmt(n) {
  const v = Number(n) || 0;
  if (v === 0) return '<span style="color:#cbd5e1">—</span>';
  return '₱' + v.toLocaleString('en-PH', {maximumFractionDigits: 0});
}
function fmtFull(n) {
  const v = Number(n) || 0;
  return '₱' + v.toLocaleString('en-PH', {maximumFractionDigits: 0});
}
function fmt2(n) {
  const v = Number(n) || 0;
  return '₱' + v.toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function getMonthLabelFromDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  return (d.getMonth() + 1) + '月';
}

function syncTuitionToMonths() {
  if (!db.months || !db.tuitionRecords) return;
  const monthMap = {};
  db.months.forEach((m, idx) => { monthMap[m.label] = idx; });
  db.months.forEach(m => {
    if (!m.income) m.income = {};
    m.income['武术学费'] = 0;
  });
  db.tuitionRecords.forEach(r => {
    const label = getMonthLabelFromDate(r.date);
    if (label && monthMap[label] !== undefined) {
      db.months[monthMap[label]].income['武术学费'] += Number(r.amount) || 0;
    }
  });
}
function fmtSigned(n) {
  const v = Number(n) || 0;
  const sign = v < 0 ? '-' : '';
  return sign + '₱' + Math.abs(v).toLocaleString('en-PH', {maximumFractionDigits: 0});
}
function getMonthExpense(m) { return Object.values(m.expenses || {}).reduce((a,b)=>a+(Number(b)||0), 0); }
function getMonthIncome(m) { return Object.values(m.income || {}).reduce((a,b)=>a+(Number(b)||0), 0); }
function getCatTotal(cat, type) {
  return db.months.reduce((sum, m) => {
    const val = type === 'expense' ? (m.expenses && m.expenses[cat]) : (m.income && m.income[cat]);
    return sum + (Number(val) || 0);
  }, 0);
}

function renderFindings(totalIncome, totalExpense, totalProfit, profitArr, labels, months) {
  const findings = [];
  const monthCount = months.length;
  const avgLoss = totalProfit / monthCount;
  const worstIdx = profitArr.indexOf(Math.min(...profitArr));
  const bestIdx = profitArr.indexOf(Math.max(...profitArr));

  if (totalProfit < 0) {
    findings.push(`<strong>持续亏损：</strong>${monthCount} 个月${profitArr.every(v=>v<0)?'全部':`有 ${profitArr.filter(v=>v<0).length} 个月`}处于亏损状态，月均亏损约 ${fmtFull(Math.abs(avgLoss))}，累计亏损 ${fmtFull(Math.abs(totalProfit))}。`);
  } else {
    findings.push(`<strong>整体盈利：</strong>${monthCount} 个月累计盈余 ${fmtFull(totalProfit)}，月均 ${fmtFull(totalProfit/monthCount)}。`);
  }

  findings.push(`<strong>亏损最高峰：</strong>${labels[worstIdx]} 盈亏 ${fmtSigned(profitArr[worstIdx])}，收入 ${fmtFull(getMonthIncome(months[worstIdx]))}，支出 ${fmtFull(getMonthExpense(months[worstIdx]))}。`);

  // Fixed cost analysis
  const salaryTotal = getCatTotal('团体工资','expense');
  const rentTotal = getCatTotal('房租','expense');
  const fixedTotal = salaryTotal + rentTotal;
  if (totalExpense > 0 && fixedTotal > 0) {
    const fixedPct = (fixedTotal / totalExpense * 100).toFixed(1);
    findings.push(`<strong>固定成本占比：</strong>团体工资 + 房租合计 ${fmtFull(fixedTotal)}，占总支出 ${fixedPct}%，运营刚性压力${fixedPct > 70 ? '极大' : '较高'}。`);
  }

  // Income structure
  const tuitionTotal = getCatTotal('武术学费','income');
  if (tuitionTotal > 0 && totalIncome > 0) {
    const tPct = (tuitionTotal / totalIncome * 100).toFixed(1);
    findings.push(`<strong>收入结构：</strong>武术学费占总收入 ${tPct}%（${fmtFull(tuitionTotal)}），${tPct > 70 ? '高度依赖单一收入来源' : '收入来源相对均衡'}。`);
  }

  // Electric trend
  const elecCats = months.map(m => m.expenses && m.expenses['电费'] ? Number(m.expenses['电费']) : 0);
  const elecMax = Math.max(...elecCats);
  const elecMin = Math.min(...elecCats.filter(v => v > 0));
  if (elecMax > elecMin * 1.5) {
    findings.push(`<strong>电费波动：</strong>电费从最低 ${fmtFull(elecMin)} 升至 ${fmtFull(elecMax)}，涨幅 ${((elecMax/elecMin-1)*100).toFixed(0)}%，建议核查用电情况。`);
  }

  // Trend analysis
  if (profitArr.length >= 3) {
    const last3 = profitArr.slice(-3);
    const prev3 = profitArr.slice(-6, -3);
    if (prev3.length > 0) {
      const lastAvg = last3.reduce((a,b)=>a+b,0)/last3.length;
      const prevAvg = prev3.reduce((a,b)=>a+b,0)/prev3.length;
      if (lastAvg > prevAvg) {
        findings.push(`<strong>趋势向好：</strong>近 3 个月月均盈亏 ${fmtFull(lastAvg)}，较前 3 个月（${fmtFull(prevAvg)}）改善 ${fmtFull(lastAvg - prevAvg)}。`);
      } else {
        findings.push(`<strong>趋势恶化：</strong>近 3 个月月均盈亏 ${fmtFull(lastAvg)}，较前 3 个月（${fmtFull(prevAvg)}）进一步下降 ${fmtFull(prevAvg - lastAvg)}。`);
      }
    } else {
      if (profitArr[profitArr.length-1] > profitArr[0]) {
        findings.push(`<strong>趋势向好：</strong>从 ${labels[0]} 的 ${fmtSigned(profitArr[0])} 收窄至 ${labels[labels.length-1]} 的 ${fmtSigned(profitArr[profitArr.length-1])}。`);
      }
    }
  }

  document.getElementById('findingsBox').innerHTML = `
    <h3>💡 主要发现与建议</h3>
    <ul>${findings.map(f => `<li>${f}</li>`).join('')}</ul>`;
}

function renderDetailTable(labels) {
  const months = db.months;
  const colCount = labels.length + 2; // name + months + total
  let html = `<thead><tr><th>收支项目</th>`;
  labels.forEach(l => html += `<th>${l}</th>`);
  html += `<th style="background:#eff6ff">合计</th></tr></thead><tbody>`;

  // Expenses
  html += `<tr class="section-row"><td colspan="${colCount}">支出项 / Expenses</td></tr>`;
  db.expenseCats.forEach(cat => {
    const rowTotal = getCatTotal(cat, 'expense');
    html += `<tr class="row-out"><td>${cat}支出</td>`;
    months.forEach(m => {
      const v = m.expenses && m.expenses[cat];
      html += `<td>${v ? fmt(v) : '<span style="color:#cbd5e1">—</span>'}</td>`;
    });
    html += `<td style="background:#eff6ff;font-weight:700">${fmt(rowTotal)}</td></tr>`;
  });
  // Expense total row
  html += `<tr class="row-total"><td>总支出</td>`;
  months.forEach(m => { html += `<td>${fmt(getMonthExpense(m))}</td>`; });
  html += `<td style="background:#eff6ff">${fmt(months.reduce((a,m)=>a+getMonthExpense(m),0))}</td></tr>`;

  // Income
  html += `<tr class="section-row" style="background:#f0fdf4;color:#16a34a"><td colspan="${colCount}">收入项 / Income</td></tr>`;
  db.incomeCats.forEach(cat => {
    const rowTotal = getCatTotal(cat, 'income');
    html += `<tr class="row-in"><td>${cat.slice(-2) === '收入' ? cat : cat + '收入'}</td>`;
    months.forEach(m => {
      const v = m.income && m.income[cat];
      html += `<td>${v ? fmt(v) : '<span style="color:#cbd5e1">—</span>'}</td>`;
    });
    html += `<td style="background:#eff6ff;font-weight:700">${fmt(rowTotal)}</td></tr>`;
  });
  // Income total row
  html += `<tr class="row-total"><td>总收入</td>`;
  months.forEach(m => { html += `<td>${fmt(getMonthIncome(m))}</td>`; });
  html += `<td style="background:#eff6ff">${fmt(months.reduce((a,m)=>a+getMonthIncome(m),0))}</td></tr>`;

  // Profit row
  html += `<tr class="row-loss"><td>盈亏</td>`;
  months.forEach(m => {
    const p = getMonthIncome(m) - getMonthExpense(m);
    html += `<td>${fmtSigned(p)}</td>`;
  });
  const totalP = months.reduce((a,m)=>a+getMonthIncome(m)-getMonthExpense(m),0);
  html += `<td style="background:#fef2f2">${fmtSigned(totalP)}</td></tr>`;

  html += `</tbody>`;
  document.getElementById('detailTable').innerHTML = html;
}

function renderTuitionByMonth() {
  const card = document.getElementById('tuitionMonthCard');
  if (!card) return;
  const recs = db.tuitionRecords || [];
  const map = {};
  recs.forEach(r => {
    const label = getMonthLabelFromDate(r.date);
    if (!label) return;
    if (!map[label]) map[label] = { count: 0, amount: 0, cash: 0, cashCount: 0, transferPublic: 0, transferPublicCount: 0, transferPersonal: 0, transferPersonalCount: 0, check: 0, checkPublic: 0, checkPublicCount: 0, checkPersonal: 0, checkPersonalCount: 0, gcash: 0, gcashCount: 0 };
    map[label].count++;
    map[label].amount += Number(r.amount) || 0;
    const m = r.method || '其他';
    if (m === '现金') { map[label].cash += Number(r.amount) || 0; map[label].cashCount++; }
    else if (m === '银行转账') {
      if (r.account === 'AUB公账') { map[label].transferPublic += Number(r.amount) || 0; map[label].transferPublicCount++; }
      else if (r.account === 'AUB个人') { map[label].transferPersonal += Number(r.amount) || 0; map[label].transferPersonalCount++; }
    }
    else if (m === '支票') {
      if (r.account === '公户') { map[label].checkPublic += Number(r.amount) || 0; map[label].checkPublicCount++; }
      else if (r.account === '个人') { map[label].checkPersonal += Number(r.amount) || 0; map[label].checkPersonalCount++; }
      else map[label].check += Number(r.amount) || 0;
    }
    else if (m === 'gcash') { map[label].gcash += Number(r.amount) || 0; map[label].gcashCount++; }
  });
  const months = db.months || [];
  const hasData = months.some(m => (m.income && m.income['武术学费']) || map[m.label]);
  if (!hasData) { card.style.display = 'none'; return; }
  card.style.display = '';
  const fmtCC = (amount, count) => amount > 0 ? fmtFull(amount) + '<br><span style="font-size:12px;color:#64748b">' + count + ' 笔</span>' : '<span style="color:#cbd5e1">—</span>';

// ===================== 明细账本 → 月度支出自动汇总 =====================
// 菲籍员工工资 → 支出项「团体工资」；房租交款 → 「房租」；网费 → 「网费」（都按日期自动汇总）
const PAYROLL_ROW = '团体工资';
const AUTO_EXPENSE_ROWS = [PAYROLL_ROW, '房租', '网费'];
const LEGACY_AUTO_ROWS = ['菲籍员工工资'];

function autoUtilities() {
  if (!db.utilities) db.utilities = { meters: [], electricBills: {}, electricPayments: [], waterPayments: [], netPayments: [], nextId: { electric: 1, water: 1 } };
  if (!db.utilities.netPayments) db.utilities.netPayments = [];
  return db.utilities;
}

function ensureAutoExpenseCats() {
  if (!db.expenseCats) db.expenseCats = [];
  // 旧版曾单独建过「菲籍员工工资」行，现已并入「团体工资」，清掉避免重复计算
  LEGACY_AUTO_ROWS.forEach(c => {
    db.expenseCats = db.expenseCats.filter(x => x !== c);
    (db.months || []).forEach(m => { if (m.expenses) delete m.expenses[c]; });
  });
  AUTO_EXPENSE_ROWS.forEach(c => {
    if (db.expenseCats.indexOf(c) === -1) db.expenseCats.push(c);
  });
}

// 旧版手动录入的 团体工资 / 房租 / 网费 金额转成明细记录，保证汇总前后总额不变（各只跑一次）
function migrateLegacyAutoExpenses() {
  if (!db.months) db.months = [];
  const u = autoUtilities();
  const RENT = '房租', NET = '网费';
  if (!db.rentRecords) db.rentRecords = [];
  if (!db.payrollRecords) db.payrollRecords = [];
  const year = Number(db.year) || new Date().getFullYear();
  let seq = 0;

  if (!db.autoExpenseLegacyMigrated) {
    const rentTaken = {}, netTaken = {};
    db.rentRecords.forEach(r => { if (r.period) rentTaken[r.period] = true; });
    u.netPayments.forEach(n => { const mon = Number(n.month) || 0; if (mon) netTaken[mon] = true; });
    db.months.forEach(m => {
      const mon = parseInt(m.label, 10) || 0;
      if (!mon) return;
      const label = mon + '月';
      const mm = String(mon).padStart(2, '0');
      const rent = Number(m.expenses && m.expenses[RENT]) || 0;
      const net = Number(m.expenses && m.expenses[NET]) || 0;
      if (rent > 0 && !rentTaken[label]) {
        db.rentRecords.push({ id: Date.now() + (seq++), date: year + '-' + mm + '-01', period: label, amount: rent, payee: '', note: '历史数据（原手动录入）', legacy: true });
        rentTaken[label] = true;
      }
      if (net > 0 && !netTaken[mon]) {
        u.netPayments.push({ id: Date.now() + (seq++), month: mon, payDate: '', amount: net, provider: '', note: '历史数据（原手动录入）', legacy: true });
        netTaken[mon] = true;
      }
    });
    db.autoExpenseLegacyMigrated = true;
  }

  // 团体工资：原来的手填金额转成一条发薪记录，避免改成自动后金额消失
  if (!db.payrollLegacyMigrated) {
    const taken = {};
    db.payrollRecords.forEach(r => {
      const l = getMonthLabelFromDate(r.date);
      if (l) taken[l] = true;
    });
    db.months.forEach(m => {
      const mon = parseInt(m.label, 10) || 0;
      if (!mon) return;
      const label = mon + '月';
      const v = Number(m.expenses && m.expenses[PAYROLL_ROW]) || 0;
      if (v <= 0 || taken[label]) return;
      const mm = String(mon).padStart(2, '0');
      db.payrollRecords.push({
        id: Date.now() + (seq++),
        date: year + '-' + mm + '-01',
        name: '（原团体工资）',
        info: '',
        joined: '',
        monthly: 0,
        period: '整月',
        amount: v,
        note: '历史数据（原手动录入）',
        legacy: true
      });
      taken[label] = true;
    });
    db.payrollLegacyMigrated = true;
  }
}

function syncAutoExpensesToMonths() {
  if (!db.months) return;
  const u = autoUtilities();
  const RENT = '房租', NET = '网费';
  const monthMap = {};
  db.months.forEach((m, idx) => { monthMap[m.label] = idx; });
  if (!db.expenseCats) db.expenseCats = [];
  AUTO_EXPENSE_ROWS.forEach(c => { if (db.expenseCats.indexOf(c) === -1) db.expenseCats.push(c); });
  db.months.forEach(m => {
    if (!m.expenses) m.expenses = {};
    AUTO_EXPENSE_ROWS.forEach(c => { m.expenses[c] = 0; });
  });
  const addTo = (label, cat, amount) => {
    if (!label || monthMap[label] === undefined) return;
    db.months[monthMap[label]].expenses[cat] += Number(amount) || 0;
  };
  (db.payrollRecords || []).forEach(r => addTo(getMonthLabelFromDate(r.date), PAYROLL_ROW, r.amount));
  (db.rentRecords || []).forEach(r => {
    addTo(monthMap[r.period] !== undefined ? r.period : getMonthLabelFromDate(r.date), RENT, r.amount);
  });
  u.netPayments.forEach(n => {
    const mon = Number(n.month) || 0;
    if (mon) addTo(mon + '月', NET, n.amount);
  });
}

// 载入数据后统一走一遍：补齐支出项 → 迁移旧的手动金额 → 按日期汇总
function autoExpensesBootstrap() {
  ensureAutoExpenseCats();
  migrateLegacyAutoExpenses();
  syncAutoExpensesToMonths();
}

// ===================== Temple Income (佛堂收入) =====================
const TEMPLE_CATS = ['供灯油', '祈福牌位', '功德箱', '其他'];

// 佛堂收入（供灯油/祈福牌位/功德箱/其他 四项明细的合计）自动汇总进月度收入表
const TEMPLE_ROW = '佛堂收入';

function ensureTempleIncomeCats() {
  if (!db.incomeCats) db.incomeCats = [];
  const others = db.incomeCats.filter(c => TEMPLE_CATS.indexOf(c) === -1 && c !== TEMPLE_ROW && c !== '武术学费');
  const keepTuition = db.incomeCats.indexOf('武术学费') !== -1;
  db.incomeCats = [TEMPLE_ROW].concat(keepTuition ? ['武术学费'] : [], others);
}

// 历史上「功德箱」是按月手动填的，这里一次性转成明细记录：金额与合计完全不变，之后自动汇总
function migrateLegacyGongdexiang() {
  if (db.templeLegacyMigrated) return;
  if (!db.templeRecords) db.templeRecords = [];
  if (!db.months) db.months = [];
  const year = Number(db.year) || new Date().getFullYear();
  const taken = {};
  db.templeRecords.forEach(r => {
    if (r.category === '功德箱') taken[getMonthLabelFromDate(r.date)] = true;
  });
  let seq = 0;
  db.months.forEach(m => {
    const v = Number(m.income && m.income['功德箱']) || 0;
    if (v <= 0 || taken[m.label]) return;
    const mon = String(parseInt(m.label, 10) || 1).padStart(2, '0');
    db.templeRecords.push({
      id: Date.now() + (seq++),
      date: year + '-' + mon + '-01',
      category: '功德箱',
      amount: v,
      note: '历史数据（原手动录入）',
      legacy: true
    });
  });
  db.templeLegacyMigrated = true;
}

function syncTempleToMonths() {
  if (!db.months) return;
  if (!db.templeRecords) db.templeRecords = [];
  const monthMap = {};
  db.months.forEach((m, idx) => { monthMap[m.label] = idx; });
  db.months.forEach(m => {
    if (!m.income) m.income = {};
    // 旧版本曾把四项分别当成收入项，这里清掉，避免和「佛堂收入」重复计一次
    TEMPLE_CATS.forEach(c => { delete m.income[c]; });
    m.income[TEMPLE_ROW] = 0;
  });
  db.templeRecords.forEach(r => {
    const label = getMonthLabelFromDate(r.date);
    if (label === null || monthMap[label] === undefined) return;
    db.months[monthMap[label]].income[TEMPLE_ROW] += Number(r.amount) || 0;
  });
}

// 载入数据后统一走一遍：迁移旧功德箱 → 收入项归一为「佛堂收入」→ 按月汇总

  migrateLegacyGongdexiang();
  ensureTempleIncomeCats();
  syncTempleToMonths();
  autoExpensesBootstrap();
}

  });
  html += `<tr class="row-total"><td>合计</td><td>${recs.length}</td><td>${fmtFull(t.total)}</td><td>100%</td></tr></tbody></table></div>`;
  html += '<div style="font-size:15px;font-weight:700;color:#1e40af;margin:18px 0 10px">📋 收入明细记录</div><div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>分类</th><th>金额</th><th>备注</th></tr></thead><tbody>';
  sorted.forEach(r => {
    html += `<tr><td>${escHtml(r.date) || '—'}</td><td>${escHtml(r.category) || '—'}</td><td>${fmtFull(r.amount)}</td><td>${escHtml(r.note) || '—'}</td></tr>`;
  });
  html += `<tr class="row-total"><td colspan="2">合计</td><td>${fmtFull(t.total)}</td><td></td></tr></tbody></table></div>`;
  document.getElementById('templeContent').innerHTML = html;
}

function fmtTime(t) { return new Date(t).toLocaleString('zh-CN'); }

function initSupabase() {
  try { _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { _supabase = null; }
}

// 从云端拉取最新数据（编辑页保存后，此处可见最新版本）
async function syncFromCloud(silent) {
  if (!_supabase) return;
  try {
    const { data: row, error } = await _supabase.from('annual_report_data').select('data').eq('id', 1).maybeSingle();
    if (error) { if (!silent) showToast('云端读取失败，请稍后重试'); return; }
    if (!row || !row.data) { if (!silent) showToast('云端暂无数据'); return; }
    const remote = row.data;
    const remoteTime = remote.updatedAt || 0;
    const localTime = db.updatedAt || 0;
    if (remoteTime > localTime) {
      db = remote;
      templeBootstrap();
      syncTuitionToMonths();
      persistDb();
      renderReport();
      if (!silent) showToast('已同步云端最新数据');
    } else if (!silent) {
      showToast('当前已是最新数据');
    }
  } catch (e) { if (!silent) showToast('网络异常，请稍后重试'); }
}

// ===================== Toast =====================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ===================== Init =====================
initSupabase();
templeBootstrap();
renderReport();
syncFromCloud(true); // 初次静默同步
setInterval(() => syncFromCloud(true), 60000); // 每分钟自动检查云端更新
</script>
